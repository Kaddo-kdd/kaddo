version: 1
modules:
  - id: storefront-web
    name: Storefront Web
    repoPath: ../frontend
    type: frontend
    status: active
    mainTechnology: Next.js
    owner: web-team
    capabilities:
      - browse-catalog
      - checkout
    code:
      - ../frontend/**
    docs:
      moduleDesign: knowledge/tech/modules/storefront-web/module-design.md
      stack: knowledge/tech/modules/storefront-web/stack.md
      security: knowledge/tech/modules/storefront-web/security.md
      standards: knowledge/tech/modules/storefront-web/standards.md
  - id: orders-api
    name: Orders API
    repoPath: ../backend
    type: backend
    status: active
    mainTechnology: NestJS
    owner: orders-team
    capabilities:
      - place-order
      - order-status
    code:
      - ../backend/**
    docs:
      moduleDesign: knowledge/tech/modules/orders-api/module-design.md
      stack: knowledge/tech/modules/orders-api/stack.md
      security: knowledge/tech/modules/orders-api/security.md
      standards: knowledge/tech/modules/orders-api/standards.md
  - id: fulfillment-worker
    name: Fulfillment Worker
    repoPath: ../worker
    type: worker
    status: active
    mainTechnology: Node.js
    owner: fulfillment-team
    capabilities:
      - reserve-stock
      - ship-order
    code:
      - ../worker/**
    docs:
      moduleDesign: knowledge/tech/modules/fulfillment-worker/module-design.md
      stack: knowledge/tech/modules/fulfillment-worker/stack.md
      security: knowledge/tech/modules/fulfillment-worker/security.md
      standards: knowledge/tech/modules/fulfillment-worker/standards.md
  - id: platform-infra
    name: Platform Infra
    repoPath: ../infra
    type: infrastructure
    status: active
    mainTechnology: Terraform
    owner: platform-team
    capabilities:
      - provisioning
      - event-bus
    code:
      - ../infra/**
    docs:
      moduleDesign: knowledge/tech/modules/platform-infra/module-design.md
      stack: knowledge/tech/modules/platform-infra/stack.md
      security: knowledge/tech/modules/platform-infra/security.md
      standards: knowledge/tech/modules/platform-infra/standards.md
