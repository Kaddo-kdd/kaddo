name: Audit analyzer isolation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sandbox-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Pull pinned analyzer image
        run: docker pull node:22.14.0-alpine@sha256:9bef0ef1e268f60627da9ba7d7605e8831d5b56ad07487d24d1aa386336d1944
      - name: Check isolated Docker runtime
        run: docker --host unix:///var/run/docker.sock run --rm --pull=never --network=none --read-only --cap-drop=ALL --security-opt=no-new-privileges --pids-limit=128 --memory=512m --cpus=1 --user=65534:65534 --mount type=bind,src=/tmp,dst=/workspace,readonly,bind-recursive=disabled --workdir /workspace --entrypoint node node:22.14.0-alpine@sha256:9bef0ef1e268f60627da9ba7d7605e8831d5b56ad07487d24d1aa386336d1944 --version
      - name: Exercise real isolated analyzer
        env:
          KADDO_TEST_DOCKER_SANDBOX: '1'
        run: pnpm exec vitest run --config vitest.config.ts packages/admin-server/tests/audit-sandbox.test.ts
