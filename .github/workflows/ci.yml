name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      - name: Test (all packages)
        run: pnpm test

      - name: Verify both package versions are in sync
        run: |
          CLI=$(node -p "require('./packages/cli/package.json').version")
          MCP=$(node -p "require('./packages/mcp/package.json').version")
          echo "cli=$CLI mcp=$MCP"
          if [ "$CLI" != "$MCP" ]; then
            echo "::error::@kaddo/cli ($CLI) and @kaddo/mcp ($MCP) versions are out of sync"
            exit 1
          fi
